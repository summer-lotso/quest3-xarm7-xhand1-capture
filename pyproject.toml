[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest3-xarm7-xhand1-capture"
version = "0.1.0"
description = "Meta Quest 3 USB teleoperation and LeRobot Dataset v2.1 capture for xArm7 and left XHand1"
requires-python = ">=3.10,<3.11"
dependencies = [
  "xarm-python-sdk==1.18.4", "numpy==2.2.6", "PyYAML==6.0.2",
  "pyzmq==26.4.0", "msgpack==1.1.1", "websockets==15.0.1",
]

[project.optional-dependencies]
cameras = ["pyrealsense2==2.56.5.9235", "opencv-python-headless==4.12.0.88"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
